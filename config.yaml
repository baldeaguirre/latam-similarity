# -----------------------------------------------------------------------------
# CATEGORY WEIGHTS
# 9 categories, each with equal default weight = 1/9 ≈ 0.111
# Demographics excluded from similarity by default (structural only).
# Sum of non-demographic weights should equal 1.0.
# Adjust weights here; pipeline reads from this section.
# -----------------------------------------------------------------------------
category_weights:
  economy: 0.125
  social: 0.125
  education: 0.125
  health: 0.125
  governance: 0.125
  infrastructure: 0.125
  democracy: 0.125
  productivity: 0.125
  demographics: 0.0  # excluded from similarity computation by default

# -----------------------------------------------------------------------------
# PREPROCESSING SETTINGS
# -----------------------------------------------------------------------------
preprocessing:
  missingness_threshold: 0.30   # drop indicator if missing > 30% of countries
  knn_impute_k: 3
  random_state: 42

# -----------------------------------------------------------------------------
# SIMILARITY SETTINGS
# -----------------------------------------------------------------------------
similarity:
  metrics:
    - cosine
    - euclidean
    - pearson
  composite_method: mean  # average of all three metrics
  output_range: [0.0, 1.0]

# -----------------------------------------------------------------------------
# EMBEDDING SETTINGS
# -----------------------------------------------------------------------------
embeddings:
  random_state: 42
  tsne:
    perplexity: 5
    n_components: 2
    n_iter: 1000
  umap:
    n_neighbors: 5
    min_dist: 0.3
    n_components: 2
  pca:
    n_components: 3  # 2D and 3D views from same decomposition

# -----------------------------------------------------------------------------
# DATA PATHS
# -----------------------------------------------------------------------------
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  features_file: "data/processed/countries_features.csv"
  similarity_matrix: "data/processed/similarity_matrix.csv"
  embeddings_file: "data/processed/embeddings.csv"

